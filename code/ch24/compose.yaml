name: chapter-24-integration

x-database-environment: &database-environment
  CH24_DATABASE_URL: postgresql://n8n:${POSTGRES_PASSWORD:-chapter-24-local-db-password}@postgres:5432/n8n

x-n8n-environment: &n8n-environment
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-chapter-24-local-db-password}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-chapter-24-local-encryption-key-change-me}
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_SECURE_COOKIE: "false"
  NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.readWriteFile"]'
  N8N_OTEL_ENABLED: "true"
  N8N_OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  N8N_OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  N8N_OTEL_EXPORTER_OTLP_TRACING_PATH: /v1/traces
  N8N_OTEL_EXPORTER_SERVICE_NAME: ch24-n8n
  N8N_OTEL_TRACES_INCLUDE_NODE_SPANS: "true"
  N8N_OTEL_TRACES_INJECT_OUTBOUND: "true"
  N8N_OTEL_TRACES_PRODUCTION_ONLY: "true"
  N8N_AGENTS_TRACING_ENABLED: "true"
  N8N_AGENTS_TRACING_RECORD_INPUTS: "false"
  N8N_AGENTS_TRACING_RECORD_OUTPUTS: "false"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chapter-24-local-db-password}
    volumes:
      - ch24-postgres:/var/lib/postgresql/data
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:16686:16686"
    networks: [lab]

  api:
    build: .
    environment:
      <<: *database-environment
      CH24_APPROVAL_KEY: ${CH24_APPROVAL_KEY:-chapter-24-local-approval-key-change-me}
      CH24_EXECUTOR_KEY: ${CH24_EXECUTOR_KEY:-chapter-24-local-executor-key-change-me}
      CH24_SIGNING_KEY: ${CH24_SIGNING_KEY:-chapter-24-local-signing-key-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8024:8024"
    networks: [lab]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8024/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  mcp:
    build: .
    command: ["ch24-mcp"]
    environment:
      <<: *database-environment
      CH24_MCP_TOKEN: ${CH24_MCP_TOKEN:-chapter-24-local-mcp-token-change-me}
      CH24_MCP_RESOURCE: http://mcp:8025/mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8025:8025"
    networks: [lab]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8025),2); s.close()"]
      interval: 3s
      timeout: 3s
      retries: 30

  model-fixture:
    build: .
    command: ["ch24-model-fixture"]
    ports:
      - "127.0.0.1:8026:8026"
    networks: [lab]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8026/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  n8n-bootstrap:
    image: n8nio/n8n:2.40.7
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -f /state/bootstrap-complete ]; then exit 0; fi;
        n8n import:credentials --separate --input=/lab/credentials
        && n8n import:workflow --separate --input=/lab/workflows
        && n8n publish:workflow --id=ch24Ingestion
        && n8n publish:workflow --id=ch24Agent
        && n8n publish:workflow --id=ch24HumanReview
        && touch /state/bootstrap-complete
    environment:
      <<: *n8n-environment
    volumes:
      - ./n8n/credentials:/lab/credentials:ro
      - ./n8n/workflows:/lab/workflows:ro
      - ch24-bootstrap:/state
    depends_on:
      postgres:
        condition: service_healthy
    networks: [lab]

  n8n:
    image: n8nio/n8n:2.40.7
    environment:
      <<: *n8n-environment
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://127.0.0.1:5678/
    depends_on:
      n8n-bootstrap:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
      model-fixture:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    networks: [lab]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40

networks:
  lab:
    driver: bridge

volumes:
  ch24-postgres:
  ch24-bootstrap:
