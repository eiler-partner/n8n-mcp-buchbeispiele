name: buch-ch34
services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local-only
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - ch34-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 3s
      retries: 30
  retrieval:
    build: .
    environment:
      DATABASE_URL: postgresql://lab:lab-local-only@pgvector:5432/lab
    ports:
      - "127.0.0.1:8134:8134"
    depends_on:
      pgvector: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8134/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  n8n-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: chapter-34-local-only-db-password
    volumes:
      - ch34-n8n-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      timeout: 3s
      retries: 30
  n8n-bootstrap:
    image: n8nio/n8n:2.40.7
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        n8n import:workflow --input=/lab/ch34-retrieval.json
        && n8n publish:workflow --id=ch34Retrieval
    environment: &n8n-env
      N8N_ENCRYPTION_KEY: chapter-34-local-only-encryption-key
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: chapter-34-local-only-db-password
    volumes:
      - ./n8n/ch34-retrieval.json:/lab/ch34-retrieval.json:ro
    depends_on:
      n8n-postgres: {condition: service_healthy}
      retrieval: {condition: service_healthy}
  n8n:
    image: n8nio/n8n:2.40.7
    environment:
      <<: *n8n-env
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_HOST: 127.0.0.1
      N8N_WEBHOOK_URL: http://127.0.0.1:15734/
    ports:
      - "127.0.0.1:15734:5678"
    depends_on:
      n8n-bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
volumes:
  ch34-postgres:
  ch34-n8n-db:
