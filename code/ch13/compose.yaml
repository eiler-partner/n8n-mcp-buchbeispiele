name: buch-ch13

services:
  api:
    build: .
    environment:
      LAB_HOST: 0.0.0.0
      LAB_PORT: "8080"
    ports:
      - "127.0.0.1:${CH13_PORT:-18072}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15
