name: buch-ch38

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/db_password
  N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_key
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_SECURE_COOKIE: "true"
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  N8N_WEBHOOK_URL: https://localhost:15738/
  N8N_EDITOR_BASE_URL: https://localhost:15738/
  N8N_PROXY_HOPS: "1"

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      timeout: 3s
      retries: 30
    security_opt: [no-new-privileges:true]

  n8n-bootstrap:
    image: n8nio/n8n:2.40.7
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        n8n import:workflow --input=/lab/ch38-probe.json
        && n8n publish:workflow --id=ch38Probe
    environment: *n8n-env
    secrets: [db_password, n8n_key]
    volumes:
      - ./n8n/ch38-probe.json:/lab/ch38-probe.json:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]

  n8n:
    image: n8nio/n8n:2.40.7
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/runner_token)";
        exec n8n
    environment:
      <<: *n8n-env
      N8N_PORT: "5678"
      N8N_HOST: localhost
      N8N_PROTOCOL: http
    secrets: [db_password, n8n_key, runner_token]
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-bootstrap: {condition: service_completed_successfully}
    networks: [app, data, broker]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  runners:
    image: n8nio/runners:2.40.7
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/runner_token)";
        exec tini -- /usr/local/bin/task-runner-launcher javascript python
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
    secrets: [runner_token]
    depends_on:
      n8n: {condition: service_healthy}
    networks: [broker]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "127.0.0.1:15738:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      n8n: {condition: service_healthy}
    networks: [app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    # The official Caddy binary carries cap_net_bind_service as a file capability.
    # It must remain in the bounding set even though this lab binds only 8443.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

  probe:
    image: python:3.12-slim
    profiles: [probe]
    command: ["python", "/lab/probe_service.py"]
    volumes:
      - ./probe_service.py:/lab/probe_service.py:ro
    networks: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8138/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

secrets:
  db_password:
    file: ${CH38_SECRET_DIR:?Use make ch38-live}/db_password
  n8n_key:
    file: ${CH38_SECRET_DIR:?Use make ch38-live}/n8n_key
  runner_token:
    file: ${CH38_SECRET_DIR:?Use make ch38-live}/runner_token

networks:
  app: {}
  data: {internal: true}
  broker: {internal: true}

volumes:
  pg_data: {}
  n8n_data: {}
  caddy_data: {}
  caddy_config: {}
