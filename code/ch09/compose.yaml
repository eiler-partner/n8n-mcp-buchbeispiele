name: buch-ch09

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 init_env.py}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run python3 init_env.py}
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_SECURE_COOKIE: "false"
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Run python3 init_env.py}
  GENERIC_TIMEZONE: Europe/Vienna
  TZ: Europe/Vienna

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 init_env.py}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 3s
      retries: 30

  n8n-bootstrap:
    image: n8nio/n8n:2.40.7
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -f /state/bootstrap-complete ]; then exit 0; fi;
        n8n import:workflow --separate --input=/lab/workflows
        && touch /state/bootstrap-complete
    environment: *n8n-env
    volumes:
      - ./n8n/workflows:/lab/workflows:ro
      - bootstrap-data:/state
    depends_on:
      postgres:
        condition: service_healthy
    networks: [lab]

  n8n:
    image: n8nio/n8n:2.40.7
    environment:
      <<: *n8n-env
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
    ports:
      - "127.0.0.1:${N8N_PORT:-15683}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/lab/workflows:ro
    depends_on:
      n8n-bootstrap:
        condition: service_completed_successfully
    networks: [lab]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  runners:
    build:
      context: .
      dockerfile: runners.Dockerfile
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Run python3 init_env.py}
    depends_on:
      n8n:
        condition: service_healthy
    networks: [lab]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  lab:

volumes:
  postgres-data:
  n8n-data:
  bootstrap-data:
