name: buch-ch39

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/db_password
  N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_key
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: "6379"
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  N8N_DEFAULT_BINARY_DATA_MODE: database
  N8N_WEBHOOK_RESPONSE_RELAY_SIZE_MAX: "16"
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_WEBHOOK_URL: http://127.0.0.1:15739/
  N8N_EDITOR_BASE_URL: http://127.0.0.1:15740/

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [queue]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    # Synthetic disposable queue only: production needs auth/TLS/persistence.

  bootstrap:
    image: n8nio/n8n:2.40.7
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        n8n import:workflow --input=/lab/ch39-job.json
        && n8n publish:workflow --id=ch39Job
    environment: *n8n-env
    secrets: [db_password, n8n_key]
    volumes: [./n8n/ch39-job.json:/lab/ch39-job.json:ro]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [data, queue]

  main:
    image: n8nio/n8n:2.40.7
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/runner_token)";
        exec n8n
    environment:
      <<: *n8n-env
      N8N_DISABLE_PRODUCTION_MAIN_PROCESS: "true"
    secrets: [db_password, n8n_key, runner_token]
    volumes: [n8n_data:/home/node/.n8n]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    ports: ["127.0.0.1:15740:5678"]
    networks: [data, queue, ingress]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  webhook:
    image: n8nio/n8n:2.40.7
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/runner_token)";
        exec n8n webhook
    environment: *n8n-env
    secrets: [db_password, n8n_key, runner_token]
    depends_on:
      main: {condition: service_healthy}
    ports: ["127.0.0.1:15739:5678"]
    networks: [data, queue, ingress]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  worker1:
    image: n8nio/n8n:2.40.7
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/runner_token)";
        exec n8n worker --concurrency=5
    environment:
      <<: *n8n-env
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    secrets: [db_password, n8n_key, runner_token]
    depends_on:
      main: {condition: service_healthy}
    networks: [data, queue, work, broker1]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 5s
      timeout: 3s
      retries: 40
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  runner1:
    image: n8nio/runners:2.40.7
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/runner_token)";
        exec tini -- /usr/local/bin/task-runner-launcher javascript python
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://worker1:5679
    secrets: [runner_token]
    depends_on:
      worker1: {condition: service_healthy}
    networks: [broker1]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  worker2:
    image: n8nio/n8n:2.40.7
    profiles: [scale]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/runner_token)";
        exec n8n worker --concurrency=5
    environment:
      <<: *n8n-env
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    secrets: [db_password, n8n_key, runner_token]
    depends_on:
      main: {condition: service_healthy}
    networks: [data, queue, work, broker2]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 5s
      timeout: 3s
      retries: 40
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  runner2:
    image: n8nio/runners:2.40.7
    profiles: [scale]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/runner_token)";
        exec tini -- /usr/local/bin/task-runner-launcher javascript python
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://worker2:5679
    secrets: [runner_token]
    depends_on:
      worker2: {condition: service_healthy}
    networks: [broker2]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  workload:
    image: python:3.12-slim
    command: ["python", "/lab/workload_service.py"]
    volumes: [./workload_service.py:/lab/workload_service.py:ro]
    networks: [work]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8139/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

secrets:
  db_password:
    file: ${CH39_SECRET_DIR:?Use make ch39-live}/db_password
  n8n_key:
    file: ${CH39_SECRET_DIR:?Use make ch39-live}/n8n_key
  runner_token:
    file: ${CH39_SECRET_DIR:?Use make ch39-live}/runner_token

networks:
  ingress: {}
  data: {internal: true}
  queue: {internal: true}
  work: {internal: true}
  broker1: {internal: true}
  broker2: {internal: true}

volumes:
  pg_data: {}
  n8n_data: {}
