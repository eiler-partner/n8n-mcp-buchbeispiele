name: buch-ch43
services:
  knowledge:
    build: .
    environment:
      CH43_SIGNING_KEY: ${CH43_SIGNING_KEY:?set a local test key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8143/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  n8n-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: chapter-43-local-only-db-password
    volumes:
      - ch43-n8n-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      timeout: 3s
      retries: 30
  n8n-bootstrap:
    image: n8nio/n8n:2.40.7
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        n8n import:workflow --input=/lab/ch43-knowledge.json
        && n8n publish:workflow --id=ch43Knowledge
    environment: &n8n-env
      N8N_ENCRYPTION_KEY: chapter-43-local-only-encryption-key
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: chapter-43-local-only-db-password
    volumes:
      - ./n8n/ch43-knowledge.json:/lab/ch43-knowledge.json:ro
    depends_on:
      n8n-postgres: {condition: service_healthy}
      knowledge: {condition: service_healthy}
  n8n:
    image: n8nio/n8n:2.40.7
    environment:
      <<: *n8n-env
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_HOST: 127.0.0.1
      N8N_WEBHOOK_URL: http://127.0.0.1:15743/
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
    ports:
      - "127.0.0.1:15743:5678"
    depends_on:
      n8n-bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
volumes:
  ch43-n8n-db:
