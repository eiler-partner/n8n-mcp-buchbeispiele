name: buch-ch27
services:
  agent:
    build: .
    ports:
      - "127.0.0.1:8127:8127"
    volumes:
      - ch27-agent-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8127/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: chapter-27-local-only-db-password
    volumes:
      - ch27-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      timeout: 3s
      retries: 30
  n8n-bootstrap:
    image: n8nio/n8n:2.40.7
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        n8n import:workflow --input=/lab/ch27-state.json
        && n8n publish:workflow --id=ch27State
    environment: &n8n-env
      N8N_ENCRYPTION_KEY: chapter-27-local-only-encryption-key
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: chapter-27-local-only-db-password
    volumes:
      - ./n8n/ch27-state.json:/lab/ch27-state.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
  n8n:
    image: n8nio/n8n:2.40.7
    environment:
      <<: *n8n-env
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_HOST: 127.0.0.1
      N8N_WEBHOOK_URL: http://127.0.0.1:15727/
    ports:
      - "127.0.0.1:15727:5678"
    depends_on:
      n8n-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
volumes:
  ch27-agent-data:
  ch27-postgres:
