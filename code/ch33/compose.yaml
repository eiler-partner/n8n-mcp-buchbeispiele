name: buch-ch33
services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local-only
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - ch33-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 3s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:16333:6333"
    volumes:
      - ch33-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 3s
      retries: 30
  vectors:
    build: .
    environment:
      DATABASE_URL: postgresql://lab:lab-local-only@pgvector:5432/lab
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8133:8133"
    depends_on:
      pgvector: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8133/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  n8n-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: chapter-33-local-only-db-password
    volumes:
      - ch33-n8n-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      timeout: 3s
      retries: 30
  n8n-bootstrap:
    image: n8nio/n8n:2.40.7
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        n8n import:workflow --input=/lab/ch33-vectors.json
        && n8n publish:workflow --id=ch33Vectors
    environment: &n8n-env
      N8N_ENCRYPTION_KEY: chapter-33-local-only-encryption-key
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: chapter-33-local-only-db-password
    volumes:
      - ./n8n/ch33-vectors.json:/lab/ch33-vectors.json:ro
    depends_on:
      n8n-postgres: {condition: service_healthy}
      vectors: {condition: service_healthy}
  n8n:
    image: n8nio/n8n:2.40.7
    environment:
      <<: *n8n-env
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_HOST: 127.0.0.1
      N8N_WEBHOOK_URL: http://127.0.0.1:15733/
    ports:
      - "127.0.0.1:15733:5678"
    depends_on:
      n8n-bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
volumes:
  ch33-postgres:
  ch33-qdrant:
  ch33-n8n-db:
