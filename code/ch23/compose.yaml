name: chapter-23-prompt-boundary

x-n8n-environment: &n8n-environment
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-chapter-23-local-db-password}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-chapter-23-local-encryption-key-change-me}
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.readWriteFile"]'

services:
  boundary-api:
    build: .
    environment:
      CH23_CANARY_SECRET: ${CH23_CANARY_SECRET:-CANARY-CH23-NOT-A-REAL-SECRET}
      CH23_APPROVAL_KEY: ${CH23_APPROVAL_KEY:-chapter-23-local-signing-key-change-me}
    ports:
      - "127.0.0.1:8023:8023"
    networks: [lab]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8023/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  capture-sink:
    build: .
    command: ["ch23-sink"]
    ports:
      - "127.0.0.1:8024:8024"
    networks: [lab]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8024/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17-alpine
    profiles: ["n8n"]
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chapter-23-local-db-password}
    volumes:
      - ch23-postgres:/var/lib/postgresql/data
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n:
    image: n8nio/n8n:2.40.7
    profiles: ["n8n"]
    depends_on:
      postgres:
        condition: service_healthy
      boundary-api:
        condition: service_healthy
    environment:
      <<: *n8n-environment
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - ch23-n8n:/home/node/.n8n
      - ./n8n:/lab/n8n:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [lab]

networks:
  lab:
    driver: bridge

volumes:
  ch23-postgres:
  ch23-n8n:
