[project]
name = "mcp-transport-lab"
version = "0.1.0"
description = "Kapitel 16: MCP-Transporte und Versionen"
requires-python = ">=3.12"
dependencies = ["mcp==2.2.0", "uvicorn>=0.35,<1"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_transport_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
