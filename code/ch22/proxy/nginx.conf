events {}

http {
  upstream n8n_mcp {
    server n8n:5678;
  }

  server {
    listen 8080;

    location /mcp/ {
      proxy_pass http://n8n_mcp;
      proxy_http_version 1.1;
      proxy_buffering off;
      gzip off;
      chunked_transfer_encoding off;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }
  }
}
