services:
  gate:
    build: .
    ports: ["127.0.0.1:8141:8141"]
    volumes: [ch41_data:/data]
    secrets: [actor_key, approval_key]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8141/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 25
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [ch41_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      timeout: 3s
      retries: 30
  bootstrap:
    image: n8nio/n8n:2.40.7
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        n8n import:workflow --input=/lab/ch41-review.json
        && n8n publish:workflow --id=ch41Review
    environment: &n8n-env
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_key
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/db_password
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "none"
    secrets: [db_password, n8n_key]
    volumes: [./n8n/ch41-review.json:/lab/ch41-review.json:ro]
    depends_on:
      postgres: {condition: service_healthy}
      gate: {condition: service_healthy}
  n8n:
    image: n8nio/n8n:2.40.7
    environment:
      <<: *n8n-env
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://127.0.0.1:15742/
    secrets: [db_password, n8n_key]
    ports: ["127.0.0.1:15742:5678"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
volumes:
  ch41_db:
  ch41_data:
secrets:
  db_password:
    file: ${CH41_SECRETS_DIR}/db_password
  n8n_key:
    file: ${CH41_SECRETS_DIR}/n8n_key
  actor_key:
    file: ${CH41_SECRETS_DIR}/actor_key
  approval_key:
    file: ${CH41_SECRETS_DIR}/approval_key
