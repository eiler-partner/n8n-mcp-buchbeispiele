services:
  source_db:
    image: postgres:17.11-alpine
    environment: &db-env
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [ch42_source_db:/var/lib/postgresql/data]
    healthcheck: &db-health
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      timeout: 3s
      retries: 30
  source_bootstrap:
    image: n8nio/n8n:2.40.7
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        n8n import:workflow --input=/lab/ch42-proof.json
        && n8n publish:workflow --id=ch42Proof
    environment: &n8n-env
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_key
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/db_password
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "none"
      DB_POSTGRESDB_HOST: source_db
    secrets: [db_password, n8n_key]
    volumes: [./n8n/ch42-proof.json:/lab/ch42-proof.json:ro]
    depends_on:
      source_db: {condition: service_healthy}
  source_n8n:
    image: n8nio/n8n:2.40.7
    environment:
      <<: *n8n-env
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://127.0.0.1:15746/
    secrets: [db_password, n8n_key]
    ports: ["127.0.0.1:15746:5678"]
    depends_on:
      source_bootstrap: {condition: service_completed_successfully}
    healthcheck: &n8n-health
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
  restore_db:
    profiles: [restore]
    image: postgres:17.11-alpine
    environment: *db-env
    secrets: [db_password]
    volumes: [ch42_restore_db:/var/lib/postgresql/data]
    healthcheck: *db-health
  restore_n8n:
    profiles: [restore]
    image: n8nio/n8n:2.40.7
    environment:
      <<: *n8n-env
      DB_POSTGRESDB_HOST: restore_db
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://127.0.0.1:15747/
    secrets: [db_password, n8n_key]
    ports: ["127.0.0.1:15747:5678"]
    depends_on:
      restore_db: {condition: service_healthy}
    healthcheck: *n8n-health
volumes:
  ch42_source_db:
  ch42_restore_db:
secrets:
  db_password:
    file: ${CH42_SECRETS_DIR}/db_password
  n8n_key:
    file: ${CH42_SECRETS_DIR}/n8n_key
