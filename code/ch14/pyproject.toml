[project]
name = "mcp-wire-lab"
version = "0.1.0"
description = "Kapitel 14: JSON-RPC- und MCP-Wire-Traces"
requires-python = ">=3.12"
dependencies = ["mcp==2.2.0", "jsonschema==4.26.0"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_wire_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
