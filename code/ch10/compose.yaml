name: buch-ch10

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 init_env.py}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run python3 init_env.py}
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_SECURE_COOKIE: "false"
  N8N_WEBHOOK_URL: http://127.0.0.1:${N8N_PORT:-15684}/
  GENERIC_TIMEZONE: Europe/Vienna
  TZ: Europe/Vienna

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 init_env.py}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 3s
      retries: 30

  service:
    build: .
    environment:
      LAB_DATABASE: /data/ch10.sqlite3
    ports:
      - "127.0.0.1:${LAB_PORT:-18070}:8079"
    volumes: [service-data:/data]
    networks: [lab]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8079/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30

  n8n-bootstrap:
    image: n8nio/n8n:2.40.7
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -f /state/bootstrap-complete ]; then exit 0; fi;
        n8n import:workflow --separate --input=/lab/workflows
        && touch /state/bootstrap-complete
    environment: *n8n-env
    volumes:
      - ./n8n/workflows:/lab/workflows:ro
      - bootstrap-data:/state
    depends_on:
      postgres:
        condition: service_healthy
      service:
        condition: service_healthy
    networks: [lab]

  n8n:
    image: n8nio/n8n:2.40.7
    environment:
      <<: *n8n-env
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
    ports:
      - "127.0.0.1:${N8N_PORT:-15684}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/lab/workflows:ro
    depends_on:
      n8n-bootstrap:
        condition: service_completed_successfully
    networks: [lab]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  lab:

volumes:
  postgres-data:
  n8n-data:
  bootstrap-data:
  service-data:
