services:
  telemetry:
    build: .
    ports:
      - "127.0.0.1:8140:8140"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8140/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 25
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [ch40_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      timeout: 3s
      retries: 30
  bootstrap:
    image: n8nio/n8n:2.40.7
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        n8n import:workflow --input=/lab/ch40-trace.json
        && n8n publish:workflow --id=ch40Trace
    environment: &n8n-env
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_key
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/db_password
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_LOG_FORMAT: json
      N8N_METRICS: "true"
    secrets: [db_password, n8n_key]
    volumes:
      - ./n8n/ch40-trace.json:/lab/ch40-trace.json:ro
    depends_on:
      postgres: {condition: service_healthy}
      telemetry: {condition: service_healthy}
  n8n:
    image: n8nio/n8n:2.40.7
    environment:
      <<: *n8n-env
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://127.0.0.1:15741/
    secrets: [db_password, n8n_key]
    ports:
      - "127.0.0.1:15741:5678"
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
volumes:
  ch40_db:
secrets:
  db_password:
    file: ${CH40_SECRETS_DIR}/db_password
  n8n_key:
    file: ${CH40_SECRETS_DIR}/n8n_key
